trigger:
  branches:
    include:
      - ft/pipeline
      - main
      - dev
      - ft/setUp

pr:
  branches:
    include:
      - ft/pipeline
      - main
      - dev
      - ft/setUp

pool:
  vmImage: 'ubuntu-latest'

jobs:
- job: test
  timeoutInMinutes: 60
  cancelTimeoutInMinutes: 5
  continueOnError: false
  steps:
    - checkout: self

    - task: JavaToolInstaller@0
      displayName: 'Set up JDK 25'
      inputs:
        versionSpec: '25'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    - script: npx playwright install-deps
      displayName: 'Install Playwright dependencies'

    - script: npx playwright install chromium
      displayName: 'Install Playwright browsers'

    - task: Maven@3
      displayName: 'Install dependencies'
      inputs:
        mavenPomFile: 'SortingFunctionalityAutomation/pom.xml'
        goals: 'install'
        options: '-DskipTests'

    - task: Maven@3
      displayName: 'Run tests'
      inputs:
        mavenPomFile: 'SortingFunctionalityAutomation/pom.xml'
        goals: 'test'

    - task: PublishTestResults@2
      displayName: 'Publish Maven test results'
      inputs:
        testResultsFiles: '**/target/surefire-reports/*.xml'
        testRunTitle: 'Maven Tests'